name: Bootstrap Dirty Turf Source

on:
  push:
    branches:
      - main
    paths:
      - bootstrap-source.b64
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4

      - name: Verify and expand source archive
        shell: bash
        run: |
          base64 --decode bootstrap-source.b64 > /tmp/dirty-turf-source.tar.gz
          sha256sum /tmp/dirty-turf-source.tar.gz
          gzip --test /tmp/dirty-turf-source.tar.gz
          tar -xzf /tmp/dirty-turf-source.tar.gz -C .
          rm bootstrap-source.b64 .github/workflows/bootstrap.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application checks
        run: npm run check

      - name: Publish expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Dirty Turf app source"
          git push origin HEAD:main
