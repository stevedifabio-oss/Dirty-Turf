<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#047631" />
  <meta name="description" content="Finish signing in to the installed Dirty Turf Academy app." />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/legal.css" />
  <title>Open Dirty Turf Academy</title>
</head>
<body>
  <main class="content auth-callback-shell">
    <section class="auth-callback-card" aria-labelledby="auth-callback-title">
      <img src="/dirty-turf-logo.png" alt="Dirty Turf" />
      <p class="eyebrow">Secure member sign-in</p>
      <h1 id="auth-callback-title">Finish in the app.</h1>
      <p class="lede" data-auth-status role="status">Checking your sign-in link...</p>
      <a class="button auth-callback-button" data-open-app hidden>Open Dirty Turf Academy</a>
      <p class="auth-callback-help">If the app does not open, make sure it is installed from Google Play, open this page in Chrome, and tap the button again.</p>
      <a class="auth-callback-support" href="mailto:hello@dirtyturf.com?subject=Dirty%20Turf%20Academy%20sign-in">Get sign-in help</a>
    </section>
  </main>
  <script type="module" src="/mobile-auth-callback.js"></script>
</body>
</html>
