project_id = "dirty-turf-academy"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local Supabase keeps localhost as its default. The hosted project's Site URL
# is switched to app.dirtyturf.com only after Netlify DNS and TLS are healthy.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173", "https://app.dirtyturf.com", "https://app.dirtyturf.com/mobile-auth-callback.html", "https://bright-brigadeiros-df8b48.netlify.app", "com.dirtyturf.academy://auth/callback"]

[storage]
enabled = true
# Match the hosted plan's 50 MB global cap. The editor uses a conservative
# 50,000,000-byte video limit; a bucket cannot raise the hosted global limit.
file_size_limit = "50MiB"

[functions.health]
verify_jwt = false

[functions.ghl-webhook]
verify_jwt = false

[functions.ghl-status]
verify_jwt = true

[functions.create-checkout]
verify_jwt = false

[functions.public-billing-plans]
verify_jwt = false

[functions.create-billing-portal]
verify_jwt = true

[functions.academy-import]
verify_jwt = true

[functions.academy-invite-members]
verify_jwt = true

[functions.academy-notifications]
verify_jwt = false

# Custom protected dispatcher header; native device registration uses Auth RPCs.
[functions.academy-push-notifications]
verify_jwt = false

[functions.map-geocode]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

# Scheduler secret is checked by the function before any work.
[functions.academy-course-sync]
verify_jwt = false

# Outbound GHL workflow secret is checked before reading or storing payloads.
[functions.academy-community-sync]
verify_jwt = false

# Dedicated business-service checkout verifies the caller with Auth.getUser.
[functions.create-service-checkout]
verify_jwt = false

# Dedicated Stripe signature and authoritative Session verification.
[functions.service-stripe-webhook]
verify_jwt = false

# Auth.getUser and immutable service-order ownership are checked server-side.
[functions.create-service-billing-portal]
verify_jwt = false

# Auth.getUser validates the JWT before bounded private-photo processing.
[functions.create-community-photo-post]
verify_jwt = false

# Dedicated scheduler secret plus independent default-off Edge and DB switches.
[functions.academy-post-scheduler]
verify_jwt = false
